name: Release checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci --prefix mcp
      - run: python scripts/check_package.py
      - run: npm run typecheck --prefix mcp
      - run: npm test --prefix mcp
      - name: Shipped bundles match source
        run: git diff --exit-code -- mcp/dist/server.mjs mcp/dist/ifc-server.mjs
